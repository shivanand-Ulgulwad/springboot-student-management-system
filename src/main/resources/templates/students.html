<!DOCTYPE html> <html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Students</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between mb-3">
        <h2>Student Management System</h2>
        <a th:href="@{/students/new}" class="btn btn-primary"> Add Student </a>
    </div> <!-- Search Form -->
    <form method="get" th:action="@{/students}" class="d-flex mb-4">
        <input type="text" name="keyword" class="form-control me-2" placeholder="Search by name">
        <button class="btn btn-dark"> Search </button>
    </form> <!-- Table -->
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Image</th>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Age</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">

            <td>
                <img th:if="${student.imageName != null}"
                     th:src="@{'/uploads/' + ${student.imageName}}"
                     class="rounded"
                     style="width:80px; height:80px; object-fit:cover;">
            </td>

            <td th:text="${student.name}"></td>
            <td th:text="${student.email}"></td>
            <td th:text="${student.course}"></td>
            <td th:text="${student.age}"></td>

            <td>
                <a th:href="@{/students/edit/{id}(id=${student.id})}"
                   class="btn btn-warning btn-sm">
                    Edit
                </a>

                <a th:href="@{/students/delete/{id}(id=${student.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this student?')">
                    Delete
                </a>
            </td>

        </tr>
        <tr th:if="${students.empty}">
            <td colspan="6" class="text-center text-danger">
                No Students Found
            </td>
        </tr>
        </tbody>
    </table> <!-- Pagination -->
    <nav>
        <ul class="pagination">

            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${currentPage == i} ? 'active'">

                <a class="page-link"
                   th:href="@{/students(page=${i}, keyword=${keyword})}"
                   th:text="${i + 1}">
                </a>

            </li>

        </ul>
    </nav>
</div>
</body>
</html>
