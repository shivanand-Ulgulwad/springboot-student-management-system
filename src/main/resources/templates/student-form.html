<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">
            <h2>Add Student</h2>
            <form th:action="@{/students}" method="post" enctype="multipart/form-data" th:object="${student}"> <!-- Name -->
                <div class="mb-3">
                    <label>Name</label>
                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <small class="text-danger" th:errors="*{name}"> </small>
                </div>
                <!-- Email -->
                <div class="mb-3">
                    <label>Email</label>
                    <input type="email"
                           th:field="*{email}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <small class="text-danger" th:errors="*{email}"> </small>
                </div> <!-- Course -->
                <div class="mb-3">
                    <label>Course</label>
                    <input type="text"
                           th:field="*{course}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('course')} ? 'is-invalid'">
                    <small class="text-danger" th:errors="*{course}"> </small>
                </div> <!-- Age --> <div class="mb-3">
                    <label>Age</label>
                    <input type="number"
                           th:field="*{age}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('age')} ? 'is-invalid'">
                    <small class="text-danger" th:errors="*{age}"> </small>
                </div> <!-- File Upload --> <div class="mb-3">
                    <label>Upload Image</label>
                    <input type="file" name="file" class="form-control">
                </div>
                <button class="btn btn-success"> Save Student </button>
                <a th:href="@{/students}" class="btn btn-secondary"> Back </a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
