<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">
            <h2>Edit Student</h2>
            <form th:action="@{/students/update/{id}(id=${student.id})}" method="post" enctype="multipart/form-data" th:object="${student}">
                <!-- Name -->
                <div class="mb-3">
                    <label>Name</label>
                    <input type="text" th:field="*{name}" class="form-control">
                </div>
                <!-- Email -->
                <div class="mb-3"> <label>Email</label>
                    <input type="email" th:field="*{email}" class="form-control">
                </div>
                <!-- Course -->
                <div class="mb-3">
                    <label>Course</label>
                    <input type="text" th:field="*{course}" class="form-control">
                </div>
                <!-- Age -->
                <div class="mb-3">
                    <label>Age</label>
                    <input type="number" th:field="*{age}" class="form-control">
                </div>
                <!-- File Upload -->
                <div class="mb-3 text-center">

                    <img th:src="@{'/uploads/' + ${student.imageName}}"
                         class="rounded shadow"
                         style="width:100px; height:100px; object-fit:cover;">

                </div>

                <div class="mb-3">
                    <label>Upload New Image</label>

                    <input type="file"
                           name="file"
                           class="form-control">
                </div>
                <button class="btn btn-warning"> Update Student </button>
                <a th:href="@{/students}" class="btn btn-secondary"> Back </a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
